<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEO TOKYO OS v10.8 (Mobile & Timestamp)</title>
    
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.105/Build/Cesium/Cesium.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.105/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* --- Base Variables & Reset --- */
        :root {
            --neon-cyan: #00f3ff;
            --neon-red: #ff3333;
            --neon-purple: #bd00ff;
            --neon-green: #00ff41;
            --neon-gold: #f1c40f;
            --glass-bg: rgba(5, 10, 20, 0.90);
            --border-color: rgba(0, 243, 255, 0.3);
            --text-main: #eee;
            --text-dim: #aaa;
            --font-ui: 'Orbitron', sans-serif;
            --font-body: 'Roboto', sans-serif;
        }
        body, html { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; color: var(--text-main); font-family: var(--font-body); }
        
        /* --- Map Container --- */
        #cesiumContainer { width: 100%; height: 100%; z-index: 0; }

        /* --- UI Common Components --- */
        button { font-family: var(--font-ui); }
        input, textarea, select {
            width: 100%; background: #151515; border: 1px solid #444; 
            color: #fff; padding: 6px; margin-bottom: 6px; box-sizing: border-box; 
            font-family: inherit; font-size: 13px; outline: none; /* スマホで見やすいようフォント調整 */
        }
        input:focus, textarea:focus { border-color: var(--neon-cyan); }
        .action-btn { 
            width: 100%; background: var(--neon-cyan); color: #000; border: none; 
            padding: 10px; font-weight: bold; cursor: pointer; margin-top: 5px; transition: 0.2s;
        }
        .action-btn:hover { background: #fff; box-shadow: 0 0 10px var(--neon-cyan); }

        /* --- Signboard (3D Label) --- */
        #signboard-container {
            position: absolute; top: 0; left: 0; display: none; z-index: 150;
            pointer-events: none; 
            transform: translate3d(0, 0, 0); 
            will-change: transform;
        }
        .signboard-offset {
            transform: translate(-50%, -100%);
            padding-bottom: 50px; /* Space for pole */
            display: flex; flex-direction: column; align-items: center;
        }
        #signboard-card {
            width: 300px; min-height: 150px;
            background: var(--glass-bg);
            border: 1px solid var(--neon-cyan);
            border-radius: 4px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            pointer-events: auto;
            display: flex; flex-direction: column;
            position: relative;
            backdrop-filter: blur(5px);
        }
        #signboard-pole {
            width: 2px; height: 50px; background: var(--neon-cyan);
            box-shadow: 0 0 10px var(--neon-cyan);
        }
        #signboard-header {
            padding: 8px 12px; background: rgba(255,255,255,0.05); border-bottom: 1px solid #444;
            display: flex; justify-content: space-between; align-items: center;
        }
        #signboard-title { font-family: var(--font-ui); font-size: 13px; font-weight: bold; color: #fff; }
        #signboard-close { cursor: pointer; color: #888; font-size: 14px; padding: 5px; }
        #signboard-content { padding: 10px; font-size: 13px; line-height: 1.6; color: #ddd; flex-grow: 1; }
        #signboard-img { width: 100%; height: 120px; object-fit: cover; border: 1px solid #444; margin-bottom: 8px; display: none; }
        #signboard-nav { display: flex; border-top: 1px solid #444; background: rgba(0,0,0,0.3); }
        .nav-btn { flex: 1; background: transparent; border: none; color: var(--neon-cyan); padding: 12px; cursor: pointer; }
        .nav-btn:disabled { color: #444; }
        .nav-btn:first-child { border-right: 1px solid #444; }
        #page-indicator { position: absolute; bottom: 45px; right: 10px; font-size: 9px; color: #888; font-family: var(--font-ui); }

        /* --- Draggable Windows --- */
        .window {
            position: absolute; background: var(--glass-bg); border: 1px solid var(--neon-cyan);
            border-radius: 4px; z-index: 100; display: flex; flex-direction: column;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            transition: height 0.3s ease; /* Smooth collapse */
        }
        .window-header {
            background: rgba(0, 243, 255, 0.1); padding: 10px; cursor: grab;
            display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333;
        }
        .window-header:active { cursor: grabbing; }
        .window-title { font-family: var(--font-ui); font-size: 12px; color: var(--neon-cyan); margin: 0; }
        
        /* コンテンツエリア（折りたたみ用） */
        .window-content-wrapper {
            overflow: hidden;
            transition: max-height 0.3s ease-out;
            max-height: 80vh; /* Open state default */
        }
        .window-content-wrapper.collapsed {
            max-height: 0 !important;
        }
        .window-content { padding: 10px; overflow-y: auto; max-height: 60vh; }

        /* Toggle Icon Rotation */
        .toggle-icon { transition: transform 0.3s; cursor: pointer; color: #888; padding: 0 5px; }
        .toggle-icon.rotated { transform: rotate(180deg); }

        /* Window Positioning (Desktop Default) */
        #panel-feed { top: 60px; left: 20px; width: 300px; }
        #panel-post { top: 60px; left: 340px; width: 300px; display: none; }
        #panel-utility { top: 60px; right: 20px; width: 250px; }

        /* News List */
        .news-item { padding: 10px 8px; border-bottom: 1px solid #333; cursor: pointer; font-size: 12px; transition: 0.2s; color: #ccc; }
        .news-item:hover { background: rgba(0, 243, 255, 0.15); color: #fff; padding-left: 12px; }
        .badge { font-size: 9px; padding: 2px 4px; border-radius: 2px; margin-right: 5px; color:#000; font-weight:bold; display:inline-block; width: 60px; text-align: center;}
        .timestamp { display: block; font-size: 10px; color: var(--neon-cyan); margin-top: 4px; text-align: right; opacity: 0.7; font-family: var(--font-ui); }

        /* Menu Bar */
        #menubar {
            position: absolute; top: 0; left: 0; width: 100%; height: 45px;
            background: rgba(0,0,0,0.9); border-bottom: 1px solid #333;
            display: flex; align-items: center; padding: 0 10px; z-index: 200;
            overflow-x: auto; white-space: nowrap; /* Mobile Scroll */
        }
        /* Hide scrollbar */
        #menubar::-webkit-scrollbar { display: none; }
        
        .menu-btn { 
            background: transparent; border: 1px solid #444; color: var(--text-dim); 
            padding: 6px 14px; margin-right: 8px; cursor: pointer; font-size: 11px; 
            transition: 0.3s; flex-shrink: 0; 
        }
        .menu-btn:hover, .menu-btn.active { background: var(--neon-cyan); color: #000; border-color: var(--neon-cyan); }

        /* Utility & Calendar */
        #clock { font-family: var(--font-ui); font-size: 24px; text-align: center; color: #fff; text-shadow: 0 0 5px var(--neon-cyan); margin-bottom: 10px; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; font-size: 10px; margin-bottom: 10px; }
        .cal-header { color: var(--neon-cyan); font-weight: bold; padding-bottom: 5px; }
        .cal-day { padding: 6px 2px; background: rgba(255,255,255,0.05); color: #aaa; }
        .cal-today { background: var(--neon-cyan); color: #000; font-weight: bold; border: 1px solid #fff; }
        
        /* Todo */
        #todo-list { list-style: none; padding: 0; margin: 10px 0; }
        .todo-item { 
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px; margin-bottom: 4px; 
            background: rgba(255,255,255,0.1); border-left: 2px solid var(--neon-cyan);
            font-size: 12px; color: #fff; animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity:0; transform:translateX(-10px); } to { opacity:1; transform:translateX(0); } }

        /* Guide */
        #guide {
            position: absolute; bottom: 20px; right: 20px; z-index: 10;
            background: rgba(0,0,0,0.7); padding: 10px; border-radius: 4px;
            color: #aaa; font-family: var(--font-ui); font-size: 10px; line-height: 1.6; text-align: right;
            border-right: 2px solid var(--neon-cyan); pointer-events: none;
        }

        /* --- Mobile Responsive Styles --- */
        @media (max-width: 768px) {
            /* Adjust Map controls */
            .cesium-viewer-bottom { display: none; } 

            /* Windows take almost full width and stack */
            .window { 
                width: 94% !important; 
                left: 3% !important; 
                top: 60px !important; /* Reset dragged positions */
                max-height: 80vh;
            }
            /* Stagger initial display so they don't completely overlap if all open */
            #panel-feed { z-index: 101; }
            #panel-post { top: 100px !important; z-index: 102; }
            #panel-utility { top: 140px !important; z-index: 103; }

            /* Signboard responsive */
            #signboard-card { width: 90vw; }
            
            /* Hide Guide on mobile to save space */
            #guide { display: none; }

            /* Larger touch targets */
            .menu-btn { padding: 10px 15px; font-size: 12px; }
            input, select, textarea { font-size: 16px; /* Prevent iOS zoom */ }
            .news-item { padding: 15px 10px; }
            #signboard-close { padding: 10px 15px; font-size: 18px; }
        }
    </style>
</head>
<body>
    <div id="cesiumContainer"></div>
    
    <div id="guide">
        <span style="color:var(--neon-cyan); font-weight:bold;">WASD: MOVE (Shift=BOOST)</span><br>
        Middle Drag: PAN<br>
        Right Drag: ROTATE<br>
        Wheel: ZOOM<br>
        Left Click: STOP / SELECT
    </div>

    <div id="menubar">
        <div style="font-family:var(--font-ui); color:var(--neon-cyan); margin-right:20px; font-weight:bold; font-size:16px;">NEO TOKYO v10.8</div>
        <button class="menu-btn" onclick="UI.toggleWindow('panel-feed')">NEWS</button>
        <button class="menu-btn" onclick="UI.toggleWindow('panel-post')">POST</button>
        <button class="menu-btn" onclick="UI.toggleWindow('panel-utility')">SYSTEM</button>
    </div>

    <div id="signboard-container">
        <div class="signboard-offset">
            <div id="signboard-pole"></div>
            <div id="signboard-card">
                <div id="signboard-header">
                    <span id="signboard-title">Title</span>
                    <i class="fas fa-times" id="signboard-close" onclick="App.closeSignboard()"></i>
                </div>
                <div id="signboard-content">
                    <img id="signboard-img" src="" alt="News Image">
                    <div id="signboard-text"></div>
                </div>
                <div id="page-indicator">1/1</div>
                <div id="signboard-nav">
                    <button class="nav-btn" id="btn-prev" onclick="App.paginateNews(-1)">◀</button>
                    <button class="nav-btn" id="btn-next" onclick="App.paginateNews(1)">▶</button>
                </div>
            </div>
        </div>
    </div>

    <div id="panel-feed" class="window">
        <div class="window-header">
            <span class="window-title">NEWS FEED</span>
            <div>
                <i class="fas fa-chevron-up toggle-icon" onclick="UI.toggleContent('feed-wrapper', this)"></i>
                <i class="fas fa-times" style="color:#888; cursor:pointer; padding-left:10px;" onclick="UI.toggleWindow('panel-feed')"></i>
            </div>
        </div>
        <div id="feed-wrapper" class="window-content-wrapper">
            <div id="news-list-content" class="window-content news-list"></div>
        </div>
    </div>

    <div id="panel-post" class="window">
        <div class="window-header">
            <span class="window-title">OPERATION</span>
            <div>
                <i class="fas fa-chevron-up toggle-icon" onclick="UI.toggleContent('post-wrapper', this)"></i>
                <i class="fas fa-times" style="color:#888; cursor:pointer; padding-left:10px;" onclick="UI.toggleWindow('panel-post')"></i>
            </div>
        </div>
        <div id="post-wrapper" class="window-content-wrapper">
            <div class="window-content">
                <div style="display:flex; gap:5px; margin-bottom:10px;">
                    <input type="text" id="addressInput" placeholder="Search Area (e.g. Shibuya)">
                    <button onclick="App.searchAddress()" style="width:30%;background:#333;color:#fff;border:1px solid #444;">GO</button>
                </div>
                <hr style="border-color:#333;">
                
                <label style="font-size:10px; color:#888;">CATEGORY</label>
                <select id="inputCat">
                    <option value="entertainment">ENTERTAINMENT</option>
                    <option value="economy">ECONOMY</option>
                    <option value="incident">INCIDENT</option>
                    <option value="politics">POLITICS</option>
                </select>
                
                <label style="font-size:10px; color:#888;">LOCATION</label>
                <div style="display: flex; gap: 5px;">
                    <input type="text" id="inputLat" placeholder="Lat">
                    <input type="text" id="inputLon" placeholder="Lon">
                </div>
                
                <label style="font-size:10px; color:#888;">CONTENT</label>
                <input type="text" id="inputTitle" placeholder="Title">
                <input type="text" id="inputImgUrl" placeholder="Image URL (Optional)">
                <textarea id="inputBody" rows="3" placeholder="Body..."></textarea>
                
                <button class="action-btn" onclick="App.addNewsFromForm()">UPLOAD DATA</button>
            </div>
        </div>
    </div>

    <div id="panel-utility" class="window">
        <div class="window-header">
            <span class="window-title">SYSTEM</span>
            <div>
                <i class="fas fa-chevron-up toggle-icon" onclick="UI.toggleContent('utility-wrapper', this)"></i>
                <i class="fas fa-times" style="color:#888; cursor:pointer; padding-left:10px;" onclick="UI.toggleWindow('panel-utility')"></i>
            </div>
        </div>
        <div id="utility-wrapper" class="window-content-wrapper">
            <div class="window-content">
                <div id="clock">00:00:00</div>
                <div style="text-align:center; margin-bottom:5px; color:#fff; font-size:11px;" id="cal-month-display"></div>
                <div class="calendar-grid" id="calendar-container"></div>
                <div style="font-size:11px; color:#888; margin:10px 0 5px;">TASKS</div>
                <div style="display:flex; gap:2px;">
                    <input type="text" id="todo-input" placeholder="New Task...">
                    <button style="width:30px; cursor:pointer; background:#333; color:#fff; border:1px solid #555;" onclick="App.addTodo()">+</button>
                </div>
                <ul id="todo-list"></ul>
            </div>
        </div>
    </div>

    <script>
        // --- Configuration & State ---
        const CONFIG = {
            // ★★★ セキュリティ: ここにご自身のCesiumトークンを入れてください ★★★
            cesiumToken: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiJhNGYxNTA0NC05YjkyLTQwMDEtODAyNS1iNWU1MWMzOTExN2YiLCJpZCI6MzYxNjM4LCJpYXQiOjE3NjM1MTczMzd9.p33ZKkhH-eN-nTJsvfmVNyVZDjIhwwGZMx2PxAc6dig', 
            categories: {
                'incident': { color: '#ff3333', cesium: Cesium.Color.RED },
                'economy': { color: '#bd00ff', cesium: Cesium.Color.PURPLE },
                'entertainment': { color: '#f1c40f', cesium: Cesium.Color.GOLD },
                'politics': { color: '#00ff41', cesium: Cesium.Color.LIME }
            }
        };

        const STATE = {
            isOrbiting: false,
            orbitRemoveListener: null,
            currentTargetPos: null,
            currentPages: [],
            currentPageIndex: 0,
            newsData: []
        };

        // --- UI Utilities ---
        const UI = {
            toggleWindow: (id) => {
                const el = document.getElementById(id);
                // Flex指定に戻すか非表示にするか
                if (getComputedStyle(el).display === 'none') {
                    el.style.display = 'flex';
                    // 重なり順を一番上に
                    UI.bringToFront(el);
                } else {
                    el.style.display = 'none';
                }
            },
            
            // 折りたたみ機能（汎用化）
            toggleContent: (wrapperId, iconEl) => {
                const wrapper = document.getElementById(wrapperId);
                wrapper.classList.toggle('collapsed');
                // アイコンの回転
                if (iconEl) iconEl.classList.toggle('rotated');
            },

            bringToFront: (el) => {
                document.querySelectorAll('.window').forEach(w => w.style.zIndex = 100);
                el.style.zIndex = 101;
            },

            makeDraggable: (el) => {
                let isDragging = false, startX, startY, initialLeft, initialTop;
                const win = el.parentElement;

                // Mouse & Touch events handled specifically for dragging
                const startDrag = (clientX, clientY) => {
                    isDragging = true;
                    startX = clientX;
                    startY = clientY;
                    const rect = win.getBoundingClientRect();
                    initialLeft = rect.left;
                    initialTop = rect.top;
                    UI.bringToFront(win);
                };

                el.addEventListener('mousedown', (e) => {
                    startDrag(e.clientX, e.clientY);
                    e.preventDefault(); 
                });
                
                // Touch support for drag
                el.addEventListener('touchstart', (e) => {
                    const touch = e.touches[0];
                    startDrag(touch.clientX, touch.clientY);
                    // e.preventDefault(); // Allow scrolling if not dragging? No, header drag should block scroll
                }, {passive: false});

                const moveDrag = (clientX, clientY) => {
                    if (!isDragging) return;
                    const dx = clientX - startX;
                    const dy = clientY - startY;
                    win.style.left = `${initialLeft + dx}px`;
                    win.style.top = `${initialTop + dy}px`;
                };

                document.addEventListener('mousemove', (e) => moveDrag(e.clientX, e.clientY));
                document.addEventListener('touchmove', (e) => {
                    if(isDragging) {
                        const touch = e.touches[0];
                        moveDrag(touch.clientX, touch.clientY);
                        e.preventDefault(); // Prevent page scroll while dragging window
                    }
                }, {passive: false});

                const endDrag = () => isDragging = false;
                document.addEventListener('mouseup', endDrag);
                document.addEventListener('touchend', endDrag);
            }
        };

        // Initialize Draggable
        document.querySelectorAll('.window-header').forEach(h => UI.makeDraggable(h));

        // --- Cesium Initialization ---
        Cesium.Ion.defaultAccessToken = CONFIG.cesiumToken; 

        const viewer = new Cesium.Viewer('cesiumContainer', {
            terrainProvider: Cesium.createWorldTerrain(),
            timeline: false, animation: false, baseLayerPicker: false,
            geocoder: false, homeButton: false, infoBox: false, sceneModePicker: false,
            selectionIndicator: false,
            navigationHelpButton: false,
            fullscreenButton: false
        });
        const scene = viewer.scene;
        const camera = viewer.camera;
        
        // Performance & Look Settings
        scene.backgroundColor = Cesium.Color.BLACK;
        scene.fog.enabled = true;
        scene.fog.density = 0.0005;
        scene.globe.enableLighting = false;
        scene.sun.show = false;
        scene.skyBox.show = false;

        // Controller Settings
        const sscc = scene.screenSpaceCameraController;
        sscc.enableTranslate = true;
        sscc.enableRotate = true;
        sscc.enableZoom = true;
        sscc.enableTilt = true;
        sscc.enableLook = false;
        sscc.rotateEventTypes = [Cesium.CameraEventType.RIGHT_DRAG];
        sscc.tiltEventTypes = [Cesium.CameraEventType.RIGHT_DRAG];
        sscc.zoomEventTypes = [Cesium.CameraEventType.WHEEL, Cesium.CameraEventType.PINCH];
        sscc.translateEventTypes = [Cesium.CameraEventType.MIDDLE_DRAG];

        // Load Buildings
        async function loadBuildings() {
            try {
                const tileset = await Cesium.createOsmBuildings();
                scene.primitives.add(tileset);
                tileset.style = new Cesium.Cesium3DTileStyle({
                    color: { conditions: [['true', "color('cyan', 0.6)"]] },
                    show: true
                });
                // Start at Tokyo Station
                camera.flyTo({
                    destination: Cesium.Cartesian3.fromDegrees(139.767, 35.681, 1500),
                    orientation: { heading: 0, pitch: Cesium.Math.toRadians(-45) }
                });
            } catch (e) { console.error("Building load error:", e); }
        }
        loadBuildings();

        // --- Application Logic ---
        const App = {
            // Initial Data (Added 'time')
            initData: [
                { id:1, lat:35.6938, lon:139.7448, cat:'entertainment', time: "10:42", title:"千鳥ヶ淵の桜、早期開花予想", body:"暖冬の影響で例年より1週間早い開花が予想されています。", img:"https://placehold.co/600x400/f1c40f/000000?text=Sakura" },
                { id:2, lat:35.6984, lon:139.7731, cat:'entertainment', time: "09:15", title:"秋葉原eスポーツ施設開業", body:"駅前に最大級の施設が誕生しました。", img:"https://placehold.co/600x400/f1c40f/000000?text=eSports" },
                { id:3, lat:35.6852, lon:139.7528, cat:'incident', time: "08:30", title:"霞が関で通信障害発生", body:"【速報】官庁街の一部で大規模なネットワーク障害が発生中。", img:"https://placehold.co/600x400/ff3333/ffffff?text=ERROR" },
                { id:4, lat:35.6812, lon:139.7671, cat:'economy', time: "Yesterday", title:"東京駅110周年記念", body:"記念グッズ販売に行列。", img:"https://placehold.co/600x400/bd00ff/ffffff?text=TokyoSt" },
                { id:5, lat:35.6865, lon:139.7637, cat:'economy', time: "Yesterday", title:"大手町Tech Base始動", body:"AIスタートアップ支援拠点。", img:"https://placehold.co/600x400/bd00ff/ffffff?text=Tech" },
                { id:6, lat:35.6917, lon:139.7709, cat:'entertainment', time: "Yesterday", title:"神田カレーグランプリ", body:"老舗洋食店が初の栄冠。", img:"https://placehold.co/600x400/f1c40f/000000?text=Curry" },
                { id:7, lat:35.6759, lon:139.7448, cat:'politics', time: "2 days ago", title:"国会議事堂夜間ツアー", body:"夜間公開を試験導入。", img:"https://placehold.co/600x400/00ff41/000000?text=Diet" },
                { id:8, lat:35.6736, lon:139.7560, cat:'entertainment', time: "2 days ago", title:"日比谷公園ガーデニング", body:"春の新作展示会。", img:"https://placehold.co/600x400/f1c40f/000000?text=Garden" },
                { id:9, lat:35.7001, lon:139.7714, cat:'economy', time: "3 days ago", title:"レトロゲーム市場高騰", body:"海外客の需要爆発。", img:"https://placehold.co/600x400/bd00ff/ffffff?text=Retro" },
                { id:10, lat:35.6944, lon:139.7433, cat:'entertainment', time: "3 days ago", title:"靖国神社「夜桜能」", body:"3年ぶりの復活。", img:"https://placehold.co/600x400/f1c40f/000000?text=Noh" }
            ],

            // Render a single item to Map & UI list
            renderItem: (item, prepend = false) => {
                const cat = CONFIG.categories[item.cat];
                
                // 1. Add 3D Entity
                viewer.entities.add({
                    position: Cesium.Cartesian3.fromDegrees(item.lon, item.lat, 50),
                    point: { pixelSize:12, color:cat.cesium, outlineColor:Cesium.Color.WHITE, outlineWidth:2 },
                    polyline: { positions: Cesium.Cartesian3.fromDegreesArrayHeights([item.lon, item.lat, 0, item.lon, item.lat, 50]), width:2, material:cat.cesium },
                    properties: { newsData: item } 
                });
                viewer.entities.add({
                    position: Cesium.Cartesian3.fromDegrees(item.lon, item.lat, 60),
                    box: { dimensions: new Cesium.Cartesian3(60, 60, 120), material: cat.cesium.withAlpha(0.2), outline:true, outlineColor:cat.cesium },
                    properties: { newsData: item }
                });

                // 2. Add to DOM List (Include Timestamp)
                const div = document.createElement('div');
                div.className = 'news-item';
                div.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span class="badge" style="background:${cat.color}">${item.cat.toUpperCase()}</span>
                    </div>
                    <div style="margin-top:4px; font-weight:bold;">${item.title}</div>
                    <span class="timestamp"><i class="far fa-clock"></i> ${item.time}</span>
                `;
                div.onclick = () => {
                    // スマホの場合はリストを閉じて地図を見せる（任意）
                    if(window.innerWidth < 768) UI.toggleWindow('panel-feed');
                    App.startOrbit(item);
                };

                const listEl = document.getElementById('news-list-content');
                if(prepend) listEl.insertBefore(div, listEl.firstChild);
                else listEl.appendChild(div);
            },

            initAllItems: () => {
                STATE.newsData = [...App.initData];
                viewer.entities.removeAll();
                document.getElementById('news-list-content').innerHTML = '';
                STATE.newsData.forEach(item => App.renderItem(item));
            },

            // Search Logic
            searchAddress: async () => {
                const q = document.getElementById('addressInput').value;
                if (!q) return;
                try {
                    const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${q}`);
                    const d = await r.json();
                    if (d.length > 0) {
                        const lat = parseFloat(d[0].lat);
                        const lon = parseFloat(d[0].lon);
                        document.getElementById('inputLat').value = lat;
                        document.getElementById('inputLon').value = lon;
                        camera.flyTo({ destination: Cesium.Cartesian3.fromDegrees(lon, lat, 1500) });
                    } else {
                        alert("Address not found.");
                    }
                } catch (e) { console.error(e); }
            },

            // Add New Logic with Auto Timestamp
            addNewsFromForm: () => {
                const lat = parseFloat(document.getElementById('inputLat').value);
                const lon = parseFloat(document.getElementById('inputLon').value);
                const title = document.getElementById('inputTitle').value;
                const body = document.getElementById('inputBody').value;
                const cat = document.getElementById('inputCat').value;
                const imgUrl = document.getElementById('inputImgUrl').value;

                if (!lat || !lon || !title) { alert("Location and Title required."); return; }

                // Generate Current Time
                const now = new Date();
                const timeStr = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;

                const newItem = {
                    id: Date.now(), lat, lon, cat, title,
                    body: body || "No details.",
                    img: imgUrl || '',
                    time: timeStr
                };

                STATE.newsData.unshift(newItem);
                App.renderItem(newItem, true); 
                
                // Reset & Fly
                document.getElementById('inputTitle').value = '';
                document.getElementById('inputBody').value = '';
                document.getElementById('inputImgUrl').value = '';
                
                // スマホなら投稿ウィンドウを閉じる
                if(window.innerWidth < 768) UI.toggleWindow('panel-post');
                
                camera.flyTo({ destination: Cesium.Cartesian3.fromDegrees(lon, lat, 1500) });
            },

            // Orbit & Signboard Logic
            startOrbit: (item) => {
                App.stopOrbit();
                STATE.isOrbiting = true;
                App.updateSignboard(item);
                document.getElementById('signboard-container').style.display = 'block';
                
                STATE.currentTargetPos = Cesium.Cartesian3.fromDegrees(item.lon, item.lat, 50);
                
                const center = STATE.currentTargetPos;
                // スマホの場合は少し遠目から見る
                const distance = window.innerWidth < 768 ? 1800 : 1200;
                const offset = new Cesium.HeadingPitchRange(0, Cesium.Math.toRadians(-30), distance);

                camera.flyTo({
                    destination: center,
                    orientation: { heading: 0, pitch: Cesium.Math.toRadians(-30), roll: 0 },
                    duration: 1.0,
                    complete: () => {
                        camera.lookAt(center, offset);
                        if (!STATE.orbitRemoveListener) {
                            STATE.orbitRemoveListener = viewer.clock.onTick.addEventListener(() => {
                                if (STATE.isOrbiting) camera.rotateRight(0.002);
                            });
                        }
                    }
                });
            },

            stopOrbit: () => {
                if (!STATE.isOrbiting) return;
                STATE.isOrbiting = false;
                if (STATE.orbitRemoveListener) {
                    STATE.orbitRemoveListener();
                    STATE.orbitRemoveListener = null;
                }
                camera.lookAtTransform(Cesium.Matrix4.IDENTITY);
            },

            updateSignboard: (item) => {
                const cat = CONFIG.categories[item.cat];
                const els = {
                    title: document.getElementById('signboard-title'),
                    card: document.getElementById('signboard-card'),
                    pole: document.getElementById('signboard-pole'),
                    img: document.getElementById('signboard-img')
                };

                els.title.innerText = item.title;
                els.title.style.color = cat.color;
                els.card.style.borderColor = cat.color;
                els.pole.style.background = cat.color;
                els.pole.style.boxShadow = `0 0 10px ${cat.color}`;
                
                if (item.img) { els.img.src = item.img; els.img.style.display = 'block'; } 
                else { els.img.style.display = 'none'; }

                document.querySelectorAll('.nav-btn').forEach(btn => btn.style.color = cat.color);

                // 文字数調整（スマホは少なめに）
                const charLimit = window.innerWidth < 768 ? 30 : 40;
                STATE.currentPages = App.chunkString(item.body, charLimit);
                STATE.currentPageIndex = 0;
                App.renderPage();
            },

            chunkString: (str, len) => {
                const size = Math.ceil(str.length / len);
                const r = Array(size);
                let offset = 0;
                for (let i = 0; i < size; i++) { r[i] = str.substr(offset, len); offset += len; }
                return r.length ? r : [str];
            },

            renderPage: () => {
                document.getElementById('signboard-text').innerText = STATE.currentPages[STATE.currentPageIndex];
                document.getElementById('page-indicator').innerText = `${STATE.currentPageIndex + 1}/${STATE.currentPages.length}`;
                document.getElementById('btn-prev').disabled = (STATE.currentPageIndex === 0);
                document.getElementById('btn-next').disabled = (STATE.currentPageIndex === STATE.currentPages.length - 1);
            },

            paginateNews: (d) => {
                const n = STATE.currentPageIndex + d;
                if (n >= 0 && n < STATE.currentPages.length) {
                    STATE.currentPageIndex = n;
                    App.renderPage();
                }
            },

            closeSignboard: () => {
                document.getElementById('signboard-container').style.display = 'none';
                App.stopOrbit();
            },

            addTodo: () => {
                const input = document.getElementById('todo-input');
                const val = input.value;
                if(val) {
                    const li = document.createElement('li');
                    li.className = 'todo-item';
                    li.innerHTML = `<span>${val}</span><i class="fas fa-times" style="color:#ff3333;cursor:pointer;"></i>`;
                    li.querySelector('i').onclick = () => li.remove();
                    document.getElementById('todo-list').appendChild(li);
                    input.value = '';
                }
            }
        };

        // --- Initialization Calls ---
        App.initAllItems();

        // Signboard Tracking Loop
        scene.postRender.addEventListener(() => {
            const sb = document.getElementById('signboard-container');
            if (sb.style.display !== 'none' && STATE.currentTargetPos) {
                const pos = Cesium.SceneTransforms.wgs84ToWindowCoordinates(scene, STATE.currentTargetPos);
                if (pos) {
                    sb.style.opacity = 1;
                    sb.style.transform = `translate3d(${pos.x}px, ${pos.y}px, 0)`; 
                } else {
                    sb.style.opacity = 0;
                }
            }
        });

        // Interaction Handlers
        const handler = new Cesium.ScreenSpaceEventHandler(scene.canvas);
        handler.setInputAction(() => { if(STATE.isOrbiting) App.stopOrbit(); }, Cesium.ScreenSpaceEventType.LEFT_DOWN);
        handler.setInputAction(() => {
            if(STATE.isOrbiting) App.stopOrbit();
            else camera.lookAtTransform(Cesium.Matrix4.IDENTITY);
        }, Cesium.ScreenSpaceEventType.MIDDLE_DOWN);

        handler.setInputAction(click => {
            const picked = scene.pick(click.position);
            if (Cesium.defined(picked) && picked.id?.properties?.newsData) {
                App.startOrbit(picked.id.properties.newsData.getValue());
            }
        }, Cesium.ScreenSpaceEventType.LEFT_CLICK);

        // Clock
        setInterval(() => document.getElementById('clock').innerText = new Date().toLocaleTimeString(), 1000);

        // Generate Calendar
        (function generateCalendar(){
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const firstDayIndex = new Date(year, month, 1).getDay();
            
            document.getElementById('cal-month-display').innerText = `${year}.${month+1}`;
            
            const container = document.getElementById('calendar-container');
            const fragment = document.createDocumentFragment();
            
            ['S','M','T','W','T','F','S'].forEach(d => {
                const div = document.createElement('div');
                div.className = 'cal-header';
                div.innerText = d;
                fragment.appendChild(div);
            });
            
            for(let i=0; i<firstDayIndex; i++) fragment.appendChild(document.createElement('div'));
            
            for(let i=1; i<=daysInMonth; i++){
                const div = document.createElement('div');
                div.className = `cal-day ${i===now.getDate() ? 'cal-today' : ''}`;
                div.innerText = i;
                fragment.appendChild(div);
            }
            container.innerHTML = '';
            container.appendChild(fragment);
        })();
    </script>
</body>
</html>
